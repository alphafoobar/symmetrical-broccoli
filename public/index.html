<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Skills Bank — Savings Accounts</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; background: #f8fafc; color: #1e293b; }
    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; margin-bottom: 0.75rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.25rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.875rem; font-weight: 500; }
    input { display: block; width: 100%; padding: 0.5rem 0.75rem; border: 1px solid #cbd5e1; border-radius: 0.375rem; font-size: 1rem; margin-bottom: 0.75rem; }
    input[readonly] { background: #f8fafc; color: #475569; }
    button { padding: 0.5rem 1.25rem; background: #2563eb; color: #fff; border: none; border-radius: 0.375rem; font-size: 0.9rem; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    button.secondary { background: #64748b; }
    button.secondary:hover { background: #475569; }
    pre { background: #f1f5f9; border: 1px solid #e2e8f0; border-radius: 0.375rem; padding: 1rem; font-size: 0.8rem; white-space: pre-wrap; word-break: break-all; }
    .error { color: #dc2626; font-size: 0.875rem; margin-top: 0.5rem; }
    .section { background: #fff; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 1.25rem; margin-bottom: 1.5rem; }
    .token-note { font-size: 0.75rem; color: #64748b; margin-bottom: 1rem; }
    .actions { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .status { color: #475569; font-size: 0.875rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <h1>Skills Bank — Savings Accounts</h1>

  <div class="section">
    <h2>Authentication</h2>
    <p class="token-note">
      Enter a local customer ID, then request a Bearer JWT with the customer.account.my scope.
      Account calls use this ID as the authenticated customer.
    </p>
    <label for="loginCustomerId">Customer ID</label>
    <input
      type="text"
      id="loginCustomerId"
      placeholder="customer-001"
      maxlength="64"
      oninput="resetAuthentication()"
    />
    <label for="token">Bearer Token</label>
    <input type="text" id="token" placeholder="Request a JWT to continue" readonly />
    <div class="actions">
      <button id="requestTokenButton" onclick="requestToken()">Request New JWT</button>
      <span id="tokenStatus" class="status"></span>
    </div>
  </div>

  <div id="accountSections" class="hidden">
    <div class="section">
      <h2>Create Account</h2>
      <label for="customerName">Customer Name <span style="color:#dc2626">*</span></label>
      <input type="text" id="customerName" placeholder="Alice Smith" maxlength="250" />
      <label for="nickName">Nickname (optional, 5-30 characters)</label>
      <input type="text" id="nickName" placeholder="MySavings" minlength="5" maxlength="30" />
      <button onclick="createAccount()">Create Account</button>
      <div id="createResult"></div>
    </div>

    <div class="section">
      <h2>My Accounts</h2>
      <button onclick="listAccounts()">Load My Accounts</button>
      <div id="listResult"></div>
    </div>

    <div class="section">
      <h2>Get Account by ID</h2>
      <label for="accountId">Account ID (UUID)</label>
      <input type="text" id="accountId" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" />
      <button onclick="getAccount()">Get Account</button>
      <div id="getResult"></div>
    </div>
  </div>

  <script>
    const API_BASE = '/api/v1';
    const TOKEN_URL = '/default/token';

    function getToken() {
      return document.getElementById('token').value.trim();
    }

    function getLoginCustomerId() {
      return document.getElementById('loginCustomerId').value.trim();
    }

    function headers() {
      return {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${getToken()}`
      };
    }

    function setTokenStatus(message, isError) {
      const el = document.getElementById('tokenStatus');
      el.textContent = message;
      el.className = `status${isError ? ' error' : ''}`;
    }

    function showAccountSections(show) {
      document.getElementById('accountSections').classList.toggle('hidden', !show);
    }

    function resetAuthentication() {
      document.getElementById('token').value = '';
      setTokenStatus('', false);
      showAccountSections(false);
      renderResult('createResult', '', false);
      renderResult('listResult', '', false);
      renderResult('getResult', '', false);
    }

    function renderResult(elementId, data, isError) {
      const el = document.getElementById(elementId);
      el.replaceChildren();
      if (!data) {
        return;
      }
      const pre = document.createElement('pre');
      if (isError) {
        pre.classList.add('error');
      }
      pre.textContent = JSON.stringify(data, null, 2);
      el.appendChild(pre);
    }

    async function parseResponse(resp) {
      const text = await resp.text();
      if (!text) {
        return { status: resp.status, message: resp.statusText || 'Empty response body' };
      }
      try {
        return JSON.parse(text);
      } catch (err) {
        return { status: resp.status, message: text };
      }
    }

    async function requestToken() {
      const button = document.getElementById('requestTokenButton');
      const loginCustomerId = getLoginCustomerId();
      if (!loginCustomerId) {
        setTokenStatus('Enter a customer ID first.', true);
        showAccountSections(false);
        return;
      }
      if (loginCustomerId.includes(':')) {
        setTokenStatus('Customer ID cannot contain a colon.', true);
        showAccountSections(false);
        return;
      }

      button.disabled = true;
      setTokenStatus('Requesting token...', false);
      showAccountSections(false);

      try {
        const resp = await fetch(TOKEN_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'Authorization': `Basic ${btoa(`${loginCustomerId}:local-secret`)}`
          },
          body: new URLSearchParams({
            grant_type: 'client_credentials',
            scope: 'customer.account.my'
          })
        });
        const json = await parseResponse(resp);
        if (!resp.ok || !json.access_token) {
          setTokenStatus(`Token request failed: ${json.error || json.message || resp.status}`, true);
          return;
        }
        document.getElementById('token').value = json.access_token;
        setTokenStatus(`Token ready for ${loginCustomerId}.`, false);
        showAccountSections(true);
      } catch (err) {
        setTokenStatus(`Token request failed: ${err.message}`, true);
      } finally {
        button.disabled = false;
      }
    }

    async function createAccount() {
      const customerName = document.getElementById('customerName').value.trim();
      const nickName = document.getElementById('nickName').value.trim();
      if (!customerName) {
        renderResult('createResult', 'Customer name is required.', true);
        return;
      }
      const body = { customerName };
      if (nickName) body.nickName = nickName;

      try {
        const resp = await fetch(`${API_BASE}/accounts`, {
          method: 'POST',
          headers: headers(),
          body: JSON.stringify(body)
        });
        const json = await parseResponse(resp);
        renderResult('createResult', json, !resp.ok);
      } catch (err) {
        renderResult('createResult', err.message, true);
      }
    }

    async function listAccounts() {
      try {
        const resp = await fetch(`${API_BASE}/accounts`, { headers: headers() });
        const json = await parseResponse(resp);
        renderResult('listResult', json, !resp.ok);
      } catch (err) {
        renderResult('listResult', err.message, true);
      }
    }

    async function getAccount() {
      const accountId = document.getElementById('accountId').value.trim();
      if (!accountId) {
        renderResult('getResult', 'Account ID is required.', true);
        return;
      }
      try {
        const resp = await fetch(`${API_BASE}/accounts/${encodeURIComponent(accountId)}`, {
          headers: headers()
        });
        const json = await parseResponse(resp);
        renderResult('getResult', json, !resp.ok);
      } catch (err) {
        renderResult('getResult', err.message, true);
      }
    }
  </script>
</body>
</html>
