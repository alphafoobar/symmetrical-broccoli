services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: skills
      POSTGRES_USER: skills
      POSTGRES_PASSWORD: skills
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skills -d skills"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: ghcr.io/navikt/mock-oauth2-server:2.2.1
    environment:
      JSON_CONFIG: |
        {
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "requestMappings": [
                {
                  "requestParam": "grant_type",
                  "match": "client_credentials",
                  "claims": {
                    "sub": "$${clientId}",
                    "scope": "customer.account.my",
                    "aud": ["skills-api"]
                  }
                }
              ]
            }
          ]
        }
    ports:
      - "9000:8080"

  api:
    build:
      context: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skills
      SPRING_DATASOURCE_USERNAME: skills
      SPRING_DATASOURCE_PASSWORD: skills
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:9000/default
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://auth:8080/default/jwks
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started
    ports:
      - "8080:8080"

  ui:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "3000:80"
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./local/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
