spring:
  application:
    name: skills
  threads:
    virtual:
      enabled: true
  cloud:
    aws:
      secretsmanager:
        enabled: ${SPRING_CLOUD_AWS_SECRETSMANAGER_ENABLED:false}
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/skills}
    username: ${db.app.username:${JDBC_DATABASE_USERNAME:skills}}
    password: ${db.app.password:${JDBC_DATABASE_PASSWORD:skills}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-test-query: >
        SELECT 1 / (
            NOT pg_is_in_recovery()
                AND current_setting('transaction_read_only') = 'off'
        )::int AS writable;
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    user: ${db.flyway.username:${FLYWAY_DATABASE_USERNAME:${JDBC_DATABASE_USERNAME:skills}}}
    password: ${db.flyway.password:${FLYWAY_DATABASE_PASSWORD:${JDBC_DATABASE_PASSWORD:skills}}}
    placeholders:
      appDatabaseUsername: ${db.app.username:${DB_APP_USERNAME:${JDBC_DATABASE_USERNAME:skills}}}
      appDatabasePassword: ${db.app.password:${DB_APP_PASSWORD:${JDBC_DATABASE_PASSWORD:skills}}}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      repositories:
        enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/default/jwks}
  cache:
    type: redis
    redis:
      time-to-live: 300000

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level ${PID: } --- [%15.15t] [${spring.application.name}] [traceId=%X{traceId:-} spanId=%X{spanId:-}] %logger{36} : %msg %kvp%n"

resilience4j:
  circuitbreaker:
    instances:
      database:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
