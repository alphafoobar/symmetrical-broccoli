spring:
  application:
    name: skills
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/skills}
    username: ${JDBC_DATABASE_USERNAME:skills}
    password: ${JDBC_DATABASE_PASSWORD:skills}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000/default}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/default/jwks}
  cache:
    type: redis
    redis:
      time-to-live: 300000

resilience4j:
  circuitbreaker:
    instances:
      database:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
